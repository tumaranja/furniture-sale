<!-- ============================================================
     YOUR DATA. Edit this block (and, for a new language, the labels block below).
     Anything you leave out or leave empty stays empty on the page.

     Page
     - "languages": e.g. ["en"] or ["en", "fi"]. The first is the default.
       With one language there is no language switch.
     - Any text can be a plain string, or one string per language:
         "title": { "en": "White wardrobe", "es": "Armario blanco" }
     - "currency": a 3-letter code ("EUR", "USD", "GBP", "SEK"...). Prices are shown
       the way that currency is usually written ($120, £120, 120 €, 120 kr), in
       whole numbers.
     - "title", "intro": the page heading and the short note under it.
     - "signature": your name, plus any ways to reach you you want shown, all optional:
       "phone", "whatsapp" (number), "signal" (number), "telegram" (username), "email".
     - "makeYourOwn": example only (shows a "Make your own" button). Leave it out.

     Each item
     - "id", "title", "subtitle" (what it's made of), "bought" or "installed" (a date),
       "condition" (one word), "conditionInfo" (ⓘ tooltip next to the condition),
       "photos", "parts", "note" (anything worth knowing, flaws included).
     - "photos": a list of { "src": photo file name (saved in the same folder as this
       page) or full image link,
       "alt": short description }. Put the best photo first; layout and shapes are
       automatic.
     - "originalLabel": renames the original-price column (e.g. "Used price now").
     - "discount": % off for every part of this item that has no price of its own.

     Each part
     - "name", "original" (price new, per unit; leave out if unknown, but then the item
       shows no crossed-out total or discount badge), "qty" (default 1; 2 shows
       "287 € × 2 = 574 €").
     - "price": your price for all units together ("price": 0 shows "Free"), or
       "discount": % off the original instead (the page works out the price).
       A "price" wins. A part with neither shows no price.
     - "priceText": replaces the price for things that aren't for sale ("Owned by the
       landlord"); such parts don't count in the totals.
     - "info": an ⓘ tooltip: a sentence, or a list of { "label": ..., "text": ... }.
     - "link": the product page ("#" does nothing).

     Example item:
         { "id": "sofa", "title": "Sofa bed", "bought": "May 2026", "condition": "excellent",

<style>
:root{
  --bg:#F7F7F5; --ink:#0a0a0a; --line:#0a0a0a;
  --green:#138022; --green-bg:#E2F8E4;
  --radius:6px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
::selection{background:#CCE0FF; color:var(--ink)}
a{color:var(--ink); text-underline-offset:3px; text-decoration-thickness:1.5px}
a:focus-visible, button:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:2px}
.wrap{max-width:980px; margin:0 auto; padding:0 20px 96px}

/* Header */
header{padding:56px 0 25px}
.title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin:0 0 18px}
h1{font-size:clamp(34px,6vw,58px); line-height:1.02; letter-spacing:-0.025em; font-weight:700; margin:0; max-width:22ch}
header p{margin:0 0 10px; max-width:62ch; font-size:17px}
.sign{margin-top:14px}
.lang{display:flex; flex:none; margin-top:calc((1.02 * clamp(34px,6vw,58px) - 34px) / 2)}
.lang button{font:inherit; font-weight:600; border:1.5px solid var(--ink); background:transparent; color:var(--ink); padding:4px 12px; cursor:pointer; text-transform:uppercase}
.lang button:first-child{border-radius:999px 0 0 999px}
.lang button:last-child{border-radius:0 999px 999px 0}
.lang button + button{border-left:0}
.lang button:only-child{border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink); color:#fff}

/* Item */
section.item{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:32px; padding:44px 0}
header + section.item{padding-top:31px}
.head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px 24px; margin:0 0 18px}
.item h2{font-size:28px; line-height:1.15; letter-spacing:-0.015em; margin:0 0 6px; font-weight:700}
.sub{margin:0}
.meta{text-align:right; line-height:1.6; white-space:nowrap; padding-top:6px}

/* Photos */
.photos{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; align-content:flex-start; align-self:start}
/* Automatic layout (RULES.md, "How the page works"): one photo shows in its own shape; otherwise rows of 2,
   each row cropped to the shape that suits its own photos. The viewer shows originals. */
.photos img{width:calc(50% - 5px); aspect-ratio:1/1; object-fit:cover; display:block; border-radius:var(--radius); background:#e8e8e4; cursor:zoom-in}
.photos img.solo{width:100%; aspect-ratio:auto; height:auto}

/* Price block */
.price{display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin:0 0 20px}
.price > div{display:flex; align-items:center}
.price b{font-size:26px; letter-spacing:-0.02em}
.price .was b{font-weight:500}
.disc{display:inline-block; margin-left:13px; background:var(--green); color:#fff; font-size:15px; font-weight:600; padding:3px 11px; border-radius:999px; line-height:1.45; white-space:nowrap}

/* Parts table */
table{width:100%; border-collapse:collapse}
th{text-align:left; font-weight:600; padding:0 10px 8px 0; border-bottom:1.5px solid var(--line)}
td{padding:8px 10px 8px 0; vertical-align:top}
tbody tr:first-child td{padding-top:12px}
td.num, th.num{text-align:right; white-space:nowrap; padding-right:0}
td.num + td.num, th.num + th.num{padding-left:28px}
tr.total td{padding-top:8px; font-weight:800}
.tag{display:inline-block; color:var(--green); background:var(--green-bg); padding:2px 9px; border-radius:var(--radius); line-height:1.45}
tr.total .tag, tbody tr:only-child .tag{font-weight:800}
.strike{position:relative; isolation:isolate; white-space:nowrap}
.strike::before{content:""; position:absolute; left:-5px; right:-5px; top:calc(56% - 1px); height:1px; background:rgba(0,0,0,.5); z-index:-1}
.was .strike::before{height:2px; left:-7px; right:-7px}
.note{margin:16px 0 0; max-width:62ch}

/* Tooltips */
.tip{position:relative; display:inline-block; vertical-align:-2px; margin-left:10px}
.meta .tip{margin-left:5px}
.tip-btn{border:0; background:none; padding:2px; margin:-2px; color:var(--ink); cursor:help; display:flex; border-radius:50%}
.tip-text{position:fixed; left:0; top:0; width:max-content; max-width:230px; background:var(--ink); color:#fff; line-height:1.4; text-align:left; padding:8px 10px; border-radius:var(--radius); opacity:0; visibility:hidden; transition:opacity .15s; z-index:5; pointer-events:none; white-space:normal; font-weight:400}
.tip-text b{font-weight:600}
.tip:hover .tip-text, .tip-btn:focus + .tip-text{opacity:1; visibility:visible}

/* "Make your own" button (example only, data.makeYourOwn) */
.mine{position:fixed; right:calc(env(safe-area-inset-right,0px) + 16px); bottom:calc(env(safe-area-inset-bottom,0px) + 16px); z-index:50; background:var(--ink); color:#fff; text-decoration:none; font-weight:600; padding:10px 18px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mine:hover{background:#2a2a2a}
.mine:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
/* Photo viewer */
.lightbox{position:fixed; inset:0; z-index:100; background:rgba(10,10,10,.92); display:none; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%; max-height:100%; object-fit:contain; border-radius:var(--radius)}
.lb-btn{position:absolute; border:0; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; width:44px; height:44px; border-radius:22px}
.lb-prev, .lb-next{top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:24px}
.lb-prev{left:12px} .lb-next{right:12px}
.lb-count{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); text-align:center; color:rgba(255,255,255,.8)}
.lightbox :focus-visible{outline-color:#fff}

/* Phones and small tablets */
@media (max-width:720px){
  header{padding:36px 0 18px}
  section.item{grid-template-columns:1fr; gap:22px; padding:34px 0}
  header + section.item{padding-top:24px}
  .head{flex-direction:column; gap:10px}
  .meta{text-align:left; padding-top:0; white-space:normal}
}
/* Phones: each part becomes name on one line, prices below */
@media (max-width:600px){
  thead{display:none}
  tbody tr{display:flex; flex-wrap:wrap; align-items:baseline; column-gap:14px; padding:8px 0}
  tbody td, tbody tr:first-child td, tr.total td{display:block; padding:0}
  tbody td:first-child{flex:0 0 100%}
  tbody tr:not(.total) td:first-child{margin-bottom:5px}
  td.num, td.num + td.num{text-align:left; padding-left:0}
  td.empty{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button type="button" class="lb-btn lb-close"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  <button type="button" class="lb-btn lb-prev"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <img alt="">
  <button type="button" class="lb-btn lb-next"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="lb-count"></div>
</div>

<script>
(function(){
  var data = JSON.parse(document.getElementById('sale-data').textContent);
  var LABELS = JSON.parse(document.getElementById('sale-labels').textContent);
  var langs = data.languages && data.languages.length ? data.languages : ['en'];
  var cur = data.currency || 'EUR';
  var lang = langs[0];
  try { var saved = localStorage.getItem('sale-lang'); if (langs.indexOf(saved) > -1) lang = saved; } catch(e) {}

  // Text helpers
  function t(v){ if (v == null) return ''; if (typeof v === 'object') return v[lang] != null ? v[lang] : v[langs[0]] != null ? v[langs[0]] : ''; return String(v); }
  function L(k){ var set = LABELS[lang] || LABELS.en || {}; return set[k] != null ? set[k] : (LABELS.en || {})[k] || k; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // Currency in its usual written form: a 3-letter code is formatted the way that currency is
  // normally written ($120, £120, 120 €, 120 kr). Anything else is shown after the number. Whole numbers only.
  var CUR_LOCALE = { USD:'en-US', CAD:'en-CA', AUD:'en-AU', NZD:'en-NZ', GBP:'en-GB', EUR:'de-DE', CHF:'de-CH',
    SEK:'sv-SE', NOK:'nb-NO', DKK:'da-DK', ISK:'is-IS', PLN:'pl-PL', CZK:'cs-CZ', HUF:'hu-HU', RON:'ro-RO',
    JPY:'ja-JP', CNY:'zh-CN', KRW:'ko-KR', INR:'en-IN', BRL:'pt-BR', MXN:'es-MX', ZAR:'en-ZA', TRY:'tr-TR' };
  var curFmt = null;
  if (/^[A-Z]{3}$/.test(cur)) {
    try { curFmt = new Intl.NumberFormat(CUR_LOCALE[cur] || langs[0], { style:'currency', currency:cur, minimumFractionDigits:0, maximumFractionDigits:0 }); } catch(e) {}
  }
  function money(n){ var v = Math.round(n); return curFmt ? curFmt.format(v) : v + ' ' + cur; }
  var ICON = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.8" r="0.95" fill="currentColor"/></svg>';
  var tipId = 0;
  function tip(info){
    if (!info) return '';
    var body = Array.isArray(info)
      ? info.map(function(r){ return '<b>' + esc(t(r.label)) + ':</b> ' + esc(t(r.text)); }).join('<br>')
      : esc(t(info));
    var id = 'tip' + (++tipId);
    return '<span class="tip"><button type="button" class="tip-btn" aria-describedby="' + id + '" aria-label="' + esc(L('info')) + '">' + ICON + '</button><span class="tip-text" role="tooltip" id="' + id + '">' + body + '</span></span>';
  }


  // Automatic photo shapes (rules in RULES.md, "How the page works"). Shapes: 1:1, 4:3, 3:4.
  // One photo keeps its own shape. Otherwise rows of 2 in order; each row (or a lone last photo)
  // takes the shape that crops its worse-hit photo least, then least in total. Rows never affect each other.
  var SHAPES = [[1, '1/1'], [4/3, '4/3'], [3/4, '3/4']];
  function cropLoss(r, t){ return 1 - Math.min(r, t) / Math.max(r, t); }
  function pickShape(ratios){
    var best = null;
    SHAPES.forEach(function(sh){
      var losses = ratios.map(function(r){ return cropLoss(r, sh[0]); });
      var worst = Math.max.apply(null, losses), total = losses.reduce(function(a, b){ return a + b; }, 0);
      if (!best || worst < best.worst - 1e-6 || (Math.abs(worst - best.worst) < 1e-6 && total < best.total - 1e-6)) best = { css: sh[1], worst: worst, total: total };
    });
    return best.css;
  }
  function arrangePhotos(){
    [].forEach.call(document.querySelectorAll('.photos'), function(box){
      var imgs = [].slice.call(box.querySelectorAll('img'));
      var ready = imgs.map(function(img){ return img.complete && img.naturalWidth ? Promise.resolve() : new Promise(function(res){ img.addEventListener('load', res); img.addEventListener('error', res); }); });
      Promise.all(ready).then(function(){
        var ratio = function(img){ return img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1; };
        if (imgs.length < 2) return;
        for (var i = 0; i < imgs.length; i += 2){
          var row = imgs.slice(i, i + 2), css = pickShape(row.map(ratio));
          row.forEach(function(img){ img.style.aspectRatio = css; });
        }
      });
    });
  }
  // A part's price for you, for all its units: "price" if given, otherwise its original × qty minus
  // "discount" (%), taken from the part or, failing that, from the whole item. Rounded to whole numbers.
  function partPrice(p, it){
    if (typeof p.price === 'number') return p.price;
    var d = typeof p.discount === 'number' ? p.discount : it.discount;
    if (typeof d === 'number' && typeof p.original === 'number') return Math.round(p.original * (p.qty || 1) * (1 - d / 100));
    return null;  // nothing given: shown empty, not "Free"

  }
  function render(){
    tipId = 0;
    document.documentElement.lang = lang;
    document.title = t(data.title) || 'Furniture sale';
    var h = '<header><div class="title-row">' + (t(data.title) ? '<h1>' + esc(t(data.title)) + '</h1>' : '<span></span>');
    if (langs.length > 1) {
      h += '<div class="lang" role="group" aria-label="' + esc(L('language')) + '">' + langs.map(function(l){
        return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === lang) + '">' + l + '</button>';
      }).join('') + '</div>';
    }
    h += '</div>';
    if (t(data.intro)) h += '<p>' + esc(t(data.intro)) + '</p>';
    if (data.signature && (t(data.signature.name) || data.signature.phone || data.signature.email || data.signature.whatsapp || data.signature.signal || data.signature.telegram)) {
      var sg = data.signature;
      h += '<p class="sign">' + esc(t(sg.name));
      var digits = function(v){ return String(v).replace(/[^\d]/g, ''); };
      if (sg.phone) h += '<br><a href="tel:' + esc(String(sg.phone).replace(/[^+\d]/g, '')) + '">' + esc(sg.phone) + '</a>';
      if (sg.whatsapp) h += '<br><a href="https://wa.me/' + esc(digits(sg.whatsapp)) + '" target="_blank" rel="noopener">WhatsApp: ' + esc(sg.whatsapp) + '</a>';
      if (sg.signal) h += '<br><a href="https://signal.me/#p/+' + esc(digits(sg.signal)) + '" target="_blank" rel="noopener">Signal: ' + esc(sg.signal) + '</a>';
      if (sg.telegram) h += '<br><a href="https://t.me/' + esc(String(sg.telegram).replace(/^@/, '')) + '" target="_blank" rel="noopener">Telegram: @' + esc(String(sg.telegram).replace(/^@/, '')) + '</a>';
      if (sg.email) h += '<br><a href="mailto:' + esc(sg.email) + '">' + esc(sg.email) + '</a>';
      h += '</p>';
    }
    h += '</header>';
    (data.items || []).forEach(function(it){ h += item(it); });
    if (data.makeYourOwn) h += '<a class="mine" href="' + esc(data.makeYourOwn) + '" target="_blank" rel="noopener">' + esc(L('mine')) + '</a>';
    document.getElementById('app').innerHTML = h;
    arrangePhotos();
  }

  function item(it){
    var parts = it.parts || [];
    var origSum = 0, priceSum = 0, origKnown = true, priced = 0;
    parts.forEach(function(p){
      var q = p.qty || 1;
      if (p.priceText) return;
      var pp = partPrice(p, it);
      if (pp == null) return;  // no price yet: left out of the totals
      priced++;
      if (typeof p.original === 'number') origSum += p.original * q; else origKnown = false;
      priceSum += pp;
    });

    var photos = it.photos || [];
    var h = '<section class="item" id="' + esc(it.id || '') + '"><div class="photos">';
    photos.forEach(function(ph, i){ h += '<img src="' + esc(ph.src) + '" alt="' + esc(t(ph.alt)) + '" tabindex="0" role="button"' + (photos.length === 1 ? ' class="solo"' : '') + '>'; });
    h += '</div><div>';

    // Title, subtitle, bought/installed + condition
    h += '<div class="head"><div><h2>' + esc(t(it.title)) + '</h2>' + (t(it.subtitle) ? '<p class="sub">' + esc(t(it.subtitle)) + '</p>' : '') + '</div>';
    var meta = [];
    if (it.bought) meta.push(esc(L('bought')) + ': ' + esc(t(it.bought)));
    if (it.installed) meta.push(esc(L('installed')) + ': ' + esc(t(it.installed)));
    if (it.condition) meta.push(esc(L('condition')) + ': ' + esc(t(it.condition)) + tip(it.conditionInfo));
    if (meta.length) h += '<div class="meta">' + meta.join('<br>') + '</div>';
    h += '</div>';

    // Big price: crossed-out original, price for you, discount badge
    // (only when at least one part has a price; parts that aren't for sale or have no price don't count)
    if (priced) {
      h += '<div class="price">';
      if (origKnown && origSum > 0) h += '<div class="was"><b><span class="strike">' + money(origSum) + '</span></b></div>';
      h += '<div><b>' + (priceSum > 0 ? money(priceSum) : esc(L('free'))) + '</b>';
      if (origKnown && origSum > 0 && priceSum > 0 && priceSum < origSum) h += '<span class="disc">-' + Math.round((1 - priceSum / origSum) * 100) + '%</span>';
      h += '</div></div>';
    }

    // Parts table
    h += '<table><thead><tr><th>' + esc(L('part')) + '</th><th class="num">' + esc(it.originalLabel ? t(it.originalLabel) : L('original')) + '</th><th class="num">' + esc(L('price')) + '</th></tr></thead><tbody>';
    parts.forEach(function(p){
      var q = p.qty || 1;
      var name = esc(t(p.name)) + (q > 1 ? ' × ' + q : '');
      if (p.link) name = p.link === '#' ? '<a href="#" class="nolink">' + name + '</a>' : '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">' + name + '</a>';
      var orig = typeof p.original === 'number'
        ? '<td class="num"><span class="strike">' + (q > 1 ? money(p.original) + ' × ' + q + ' = ' + money(p.original * q) : money(p.original)) + '</span></td>'
        : '<td class="num empty">–</td>';
      var pp = partPrice(p, it);
      var price = p.priceText ? esc(t(p.priceText)) : pp == null ? '' : '<span class="tag">' + (pp ? money(pp) : esc(L('free'))) + '</span>';
      h += '<tr><td>' + name + tip(p.info) + '</td>' + orig + '<td class="num">' + price + '</td></tr>';
    });
    if (parts.length > 1 && priced) {
      h += '<tr class="total"><td>' + esc(L('total')) + '</td><td class="num">' + (origKnown ? '<span class="strike">' + money(origSum) + '</span>' : '') + '</td><td class="num"><span class="tag">' + (priceSum > 0 ? money(priceSum) : esc(L('free'))) + '</span></td></tr>';
    }
    h += '</tbody></table>';
    if (t(it.note)) h += '<p class="note">' + esc(t(it.note)) + '</p>';
    return h + '</div></section>';
  }

  // Placeholder links ("#") do nothing when clicked
  document.addEventListener('click', function(e){ if (e.target.closest('a.nolink')) e.preventDefault(); });

  // Language switch
  document.addEventListener('click', function(e){
    var b = e.target.closest('.lang button'); if (!b) return;
    lang = b.getAttribute('data-lang');
    try { localStorage.setItem('sale-lang', lang); } catch(err) {}
    render();
  });

  // Tooltips: fixed position so they never get cut off
  function place(tp){
    var tx = tp.querySelector('.tip-text'), b = tp.getBoundingClientRect(), w = tx.offsetWidth, ht = tx.offsetHeight;
    var x = tp.closest('.meta') ? b.right - w : b.left + b.width / 2 - w / 2;
    var y = b.bottom + 8; if (y + ht > innerHeight - 8) y = b.top - 8 - ht;
    tx.style.left = Math.min(Math.max(8, x), innerWidth - w - 8) + 'px';
    tx.style.top = Math.max(8, y) + 'px';
  }
  var active = null;
  ['mouseover','focusin','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){ var tp = e.target.closest && e.target.closest('.tip'); if (tp) { active = tp; place(tp); } }, {passive:true});
  });
  addEventListener('scroll', function(){ if (active) place(active); }, {passive:true});
  addEventListener('resize', function(){ if (active) place(active); });

  // Photo viewer
  var box = document.getElementById('lightbox'), big = box.querySelector('img'), count = box.querySelector('.lb-count');
  var prev = box.querySelector('.lb-prev'), next = box.querySelector('.lb-next'), closeBtn = box.querySelector('.lb-close');
  var group = [], idx = 0, last = null;
  function show(){
    var img = group[idx]; big.src = img.src; big.alt = img.alt;
    var many = group.length > 1;
    prev.style.display = next.style.display = count.style.display = many ? '' : 'none';
    count.textContent = many ? (idx + 1) + ' / ' + group.length : '';
  }
  function open(img){
    last = img; group = [].slice.call(img.closest('.photos').querySelectorAll('img')); idx = group.indexOf(img);
    closeBtn.setAttribute('aria-label', L('close')); prev.setAttribute('aria-label', L('prev')); next.setAttribute('aria-label', L('next'));
    show(); box.classList.add('open'); document.body.style.overflow = 'hidden'; closeBtn.focus();
  }
  function close(){ box.classList.remove('open'); document.body.style.overflow = ''; if (last) last.focus(); }
  function go(d){ if (group.length > 1) { idx = (idx + d + group.length) % group.length; show(); } }
  document.addEventListener('click', function(e){ var img = e.target.closest('.photos img'); if (img) open(img); });
  document.addEventListener('keydown', function(e){
    if (box.classList.contains('open')) {
      if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
    } else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.photos img')) { e.preventDefault(); open(e.target); }
  });
  prev.addEventListener('click', function(e){ e.stopPropagation(); go(-1); });
  next.addEventListener('click', function(e){ e.stopPropagation(); go(1); });
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  box.addEventListener('click', close);
  var sx = null, sy = null;
  box.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  box.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });

  render();
})();
</script>
</body>
</html>
